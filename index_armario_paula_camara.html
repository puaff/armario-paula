<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El armario de Paula</title><style>:root{--bg:#f8f6f2;--ink:#302a27;--muted:#827b74;--line:#e5ded5;--accent:#775a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}header{padding:28px 20px 18px;text-align:center;background:#fff}header small{letter-spacing:.3em;color:var(--muted);font-size:10px}h1{font:normal 34px Georgia,serif;margin:8px 0}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px;background:white;border-bottom:1px solid var(--line)}button{cursor:pointer;border:1px solid var(--line);background:white;padding:11px 15px;border-radius:7px;color:var(--ink)}button.active,.primary{background:var(--ink);color:white;border-color:var(--ink)}main{max-width:1050px;margin:auto;padding:24px 16px 70px}.intro{font:26px Georgia,serif;margin:0 0 6px}.hint{color:var(--muted);margin:0 0 22px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}input,select,textarea{padding:12px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);font:inherit;max-width:100%}.tools input{flex:2;min-width:170px}.tools select{flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:20px}.tile{background:white;overflow:hidden;border:1px solid var(--line);border-radius:9px}.photo{height:230px;background:#eee8df;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#a89a8b;font:18px Georgia,serif}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:13px}.info h3{font:19px Georgia,serif;margin:0 0 6px}.info p{font-size:12px;color:var(--muted);margin:0 0 12px}.info button{font-size:12px;padding:8px 10px}.panel{background:white;padding:20px;border:1px solid var(--line);border-radius:9px;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:9px}.locations{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.loc{background:white;border:1px solid var(--line);padding:20px;border-radius:9px}.loc h3{font:22px Georgia,serif;margin:0 0 10px}.loc p{color:var(--muted);font-size:13px}footer{max-width:1050px;margin:20px auto;padding:0 16px 30px;color:var(--muted);font-size:12px}#notice{margin:12px 0;color:#745947;font-size:13px} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:480px){h1{font-size:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo{height:190px}.info{padding:10px}.info h3{font-size:16px}nav button{padding:9px 10px;font-size:12px}}</style></head><body><header><small>MI COLECCIÓN PERSONAL</small><h1>El armario de Paula</h1><small>UNA PRENDA · UN LUGAR · TODO A MANO</small></header><nav><button data-tab="coleccion" class="active">Colección</button><button data-tab="bolsas">Bolsas</button><button data-tab="armarios">Armarios</button><button data-tab="anadir">+ Añadir prenda</button></nav><main id="app"></main><footer>Versión de prueba local · Los datos se guardan en este navegador. Para compartirlos entre dispositivos necesitaremos activar la sincronización en la nube. Haz copias de seguridad regularmente.</footer><script>
const KEY='armario_paula_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.items))state={items:[],locations:[{id:'B001',name:'Bolsa B001',kind:'Bolsa'},{id:'A001',name:'Armario dormitorio',kind:'Armario'},{id:'C001',name:'Cajonera',kind:'Armario'}]};let tab='coleccion',search='',filter='all',editing=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('No se ha podido guardar. Es posible que las fotos ocupen demasiado espacio. Exporta una copia y utiliza imágenes más pequeñas.');return false}};const loc=id=>state.locations.find(x=>x.id===id)?.name||'Sin ubicación';const options=(selected)=>state.locations.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');function view(t){tab=t;editing=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.tab));function render(){let a=$('#app');if(tab==='coleccion'){let items=state.items.filter(x=>(filter==='all'||x.location===filter)&&(`${x.name} ${x.category} ${x.color} ${x.season} ${loc(x.location)}`).toLowerCase().includes(search.toLowerCase()));a.innerHTML=`<h2 class="intro">Mi colección</h2><p class="hint">${state.items.length} prendas registradas · Tu boutique personal</p><div class="tools"><input id="search" placeholder="Buscar prenda, color, temporada…" value="${esc(search)}"><select id="filter"><option value="all">Todas las ubicaciones</option>${options(filter)}</select></div><div class="grid">${items.map(x=>`<article class="tile"><div class="photo">${x.photo?`<img src="${x.photo}" alt="${esc(x.name)}">`:'Sin fotografía'}</div><div class="info"><h3>${esc(x.name)}</h3><p>${esc(x.category)} · ${esc(loc(x.location))}</p><button data-edit="${esc(x.id)}">Ver / mover</button></div></article>`).join('')}</div>${!items.length?'<div class="empty">Todavía no hay prendas que mostrar. Añade la primera fotografía para comenzar.</div>':''}`;$('#search').oninput=e=>{search=e.target.value;let p=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(p,p)};$('#filter').value=filter;$('#filter').onchange=e=>{filter=e.target.value;render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;tab='anadir';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='anadir'));render()})}else if(tab==='bolsas'||tab==='armarios'){let kind=tab==='bolsas'?'Bolsa':'Armario',ls=state.locations.filter(x=>x.kind===kind);a.innerHTML=`<h2 class="intro">Mis ${tab}</h2><p class="hint">Organiza las ubicaciones y consulta cuántas prendas guardas en cada una.</p><div class="locations">${ls.map(x=>`<div class="loc"><h3>${esc(x.name)}</h3><p>${state.items.filter(i=>i.location===x.id).length} prendas</p><button data-open="${esc(x.id)}">Ver prendas</button></div>`).join('')}</div><div class="panel" style="margin-top:24px"><h3>Añadir ubicación</h3><div class="tools"><input id="newloc" placeholder="Ej. Bolsa B002 o Armario pasillo"><button id="addloc" class="primary">Crear</button></div></div>`;$('#addloc').onclick=()=>{let name=$('#newloc').value.trim();if(!name)return;state.locations.push({id:'L'+Date.now(),name,kind});save();render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{filter=b.dataset.open;search='';view('coleccion')})}else{let x=state.items.find(i=>i.id===editing)||{name:'',category:'',color:'',season:'Todo el año',location:state.locations[0]?.id||'',notes:'',photo:''};a.innerHTML=`<h2 class="intro">${editing?'Ficha de la prenda':'Nueva prenda'}</h2><p class="hint">Una fotografía por prenda, para encontrarla siempre.</p><form class="panel" id="itemform"><div class="field"><label>Fotografía</label><div class="actions"><button type="button" id="takephoto">📷 Hacer foto</button><button type="button" id="choosephoto">Elegir de la galería</button></div><input type="file" id="cameraInput" accept="image/*" capture="environment" hidden><input type="file" id="photo" accept="image/*" hidden><div id="preview" style="max-width:180px">${x.photo?`<img src="${x.photo}" style="width:100%;border-radius:8px">`:''}</div></div><div class="formgrid"><div class="field"><label>Nombre de la prenda *</label><input name="name" required value="${esc(x.name)}" placeholder="Ej. Jersey beige"></div><div class="field"><label>Tipo</label><input name="category" value="${esc(x.category)}" placeholder="Jersey, vestido, pantalón…"></div><div class="field"><label>Color</label><input name="color" value="${esc(x.color)}"></div><div class="field"><label>Temporada</label><select name="season">${['Todo el año','Invierno','Verano','Entretiempo'].map(v=>`<option ${x.season===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Ubicación actual</label><select name="location">${options(x.location)}</select></div></div><div class="field"><label>Notas</label><textarea name="notes" rows="3">${esc(x.notes)}</textarea></div><div class="actions"><button class="primary" type="submit">Guardar prenda</button>${editing?'<button type="button" id="delete">Eliminar prenda</button>':''}<button type="button" id="cancel">Volver a colección</button></div><div id="notice"></div></form><div class="panel"><strong>Copias de seguridad</strong><p class="hint" style="margin:8px 0">Exporta o importa el inventario completo, incluidas las fotografías.</p><div class="actions"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input id="importfile" type="file" accept="application/json" hidden></div></div>`;let photo=x.photo;$('#takephoto').onclick=()=>$('#cameraInput').click();$('#choosephoto').onclick=()=>$('#photo').click();const handlePhoto=async e=>{let f=e.target.files[0];if(!f)return;try{photo=await shrink(f);$('#preview').innerHTML=`<img src="${photo}" style="width:100%;border-radius:8px">`}catch(err){alert('No se pudo leer la fotografía. Prueba con una imagen JPEG o PNG.')}};$('#photo').onchange=handlePhoto;$('#cameraInput').onchange=handlePhoto;$('#itemform').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),item={id:editing||'P'+Date.now(),photo,name:fd.get('name').trim(),category:fd.get('category').trim(),color:fd.get('color').trim(),season:fd.get('season'),location:fd.get('location'),notes:fd.get('notes').trim()};if(!item.name)return;if(editing)state.items=state.items.map(v=>v.id===editing?item:v);else state.items.push(item);if(save()){search='';filter='all';view('coleccion')}};$('#cancel').onclick=()=>view('coleccion');if(editing)$('#delete').onclick=()=>{if(confirm('¿Eliminar esta prenda del inventario?')){state.items=state.items.filter(v=>v.id!==editing);save();view('coleccion')}};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='armario-paula-copia-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('#import').onclick=()=>$('#importfile').click();$('#importfile').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.items)||!Array.isArray(v.locations))throw Error('Formato no válido');if(confirm('Esto sustituirá el inventario actual. ¿Continuar?')){state=v;save();view('coleccion')}}catch(err){alert('No se pudo importar la copia: '+err.message)}}}}async function shrink(file){let img=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();return canvas.toDataURL('image/jpeg',.72)}render();</script></body></html>
